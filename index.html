<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日文五十音互動學習系統</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 24px;
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-top: 0;
            font-size: 1.8rem;
        }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 12px;
        }

        .tab-btn {
            background: none;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background-color: var(--primary-color);
            color: white;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        /* 五十音表格樣式 */
        .kana-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }

        .kana-card {
            background: #f1f5f9;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px 8px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }

        .kana-card:hover {
            background: #e2e8f0;
            transform: translateY(-2px);
        }

        .kana-char {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--text-main);
            display: block;
        }

        .kana-romaji {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
            display: block;
        }

        /* 測驗區樣式 */
        .quiz-box {
            text-align: center;
            padding: 20px 0;
        }

        .quiz-prompt {
            font-size: 3.5rem;
            font-weight: bold;
            color: var(--primary-color);
            margin: 20px 0;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            max-width: 400px;
            margin: 0 auto;
        }

        .option-btn {
            background: white;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            font-size: 1.2rem;
            padding: 14px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .option-btn:hover {
            border-color: var(--primary-color);
            background: #fdf4ff;
        }

        .quiz-stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .action-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 24px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.2s;
        }

        .action-btn:hover {
            background-color: var(--primary-hover);
        }

        .result-container {
            text-align: center;
        }

        @media (max-width: 600px) {
            .kana-grid {
                grid-template-columns: repeat(5, 1fr);
                gap: 6px;
            }
            .kana-card {
                padding: 8px 4px;
            }
            .kana-char {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🇯🇵 日文五十音互動學習</h1>

        <!-- 導覽頁籤 -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('chart')">五十音對照表</button>
            <button class="tab-btn" onclick="switchTab('quiz')">隨堂測驗挑戰</button>
        </div>

        <!-- 區塊一：五十音對照表 -->
        <div id="chart-section" class="section active">
            <div style="margin-bottom: 12px; display: flex; gap: 8px; justify-content: center;">
                <button class="action-btn" id="toggle-type-btn" onclick="toggleKanaType()" style="margin: 0; padding: 6px 14px; font-size: 0.9rem;">切換為片假名</button>
            </div>
            <div id="chart-grid" class="kana-grid"></div>
        </div>

        <!-- 區塊二：隨堂測驗 -->
        <div id="quiz-section" class="section">
            <div class="quiz-stats">
                <span>目前得分: <span id="score-val">0</span></span>
                <span>剩餘題數: <span id="left-val">10</span></span>
            </div>

            <div class="quiz-box">
                <p id="quiz-instruction" style="color: var(--text-muted);">請選出以下羅馬拼音對應的字元：</p>
                <div id="quiz-target" class="quiz-prompt">a</div>
                <div id="options-container" class="options-grid"></div>
            </div>

            <div id="result-box" class="result-container" style="display: none;">
                <h2>測驗結束！</h2>
                <p>你的最終得分是：<span id="final-score" style="font-weight: bold; color: var(--primary-color);">0</span> / 10</p>
                <button class="action-btn" onclick="startQuiz()">再測驗一次</button>
            </div>
        </div>
    </div>
